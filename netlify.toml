# Netlify serves only the React app; it cannot run Python. The FastAPI backend runs elsewhere (Render, from the
# Dockerfile) and /api/* is proxied to it, so the browser sees one domain and the login cookie just works.
[build]
  base = "frontend"   # also keeps Netlify away from the Vercel-only pyproject.toml in the root
  command = "npm run build"
  publish = "dist"

# Replace with your Render service's address. Must stay above the catch-all below.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

# Pages the browser opens directly (/today, /roadmap/learn …) get the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# FastAPI adds these to its own responses; the static files now come from Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
